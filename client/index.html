<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- Theme color follows system preference and matches the app shell -->
    <meta name="theme-color" content="#f7fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1b24" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS standalone (Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UroRads" />
    <meta name="format-detection" content="telephone=no" />

    <meta name="description" content="UroRads — case-based uro-radiology learning, one teaching image at a time." />

    <!-- Open Graph -->
    <meta property="og:title" content="UroRads — Uro-Radiology Education" />
    <meta property="og:description" content="Case-based uro-radiology learning, one teaching image at a time." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />
    <!-- iOS standalone startup image (uses the maskable PWA icon as a brand fallback
         until dedicated splash artwork is added to /public). -->
    <link rel="apple-touch-startup-image" href="/pwa-512x512.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>UroRads — Uro-Radiology Education</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
